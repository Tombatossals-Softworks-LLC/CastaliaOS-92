; ======================================================================
;  CASTALIA.INI - configuration for Castalia 92
; ----------------------------------------------------------------------
;  Lines beginning with ';' or '#' are comments.  Every setting has a
;  built-in default, so this whole file is optional: delete any line to
;  fall back to the default.  Place this file in the same directory as
;  CASTALIA.EXE (it is read from the current directory at start-up).
; ======================================================================

[system]
; Visual theme:
;   classic | penumbra | bureau | winsteel | moncloa | workbench | ocean
;   rose | midnight | amber | matrix | redmond | sunset | forest | hotdog
;   slate | sakura | dos
theme=classic
; Video mode:
;   mode13h = 320x200, 256 colours (fast, low memory)  - the default
;   mode12h = 640x480,  16 colours (more screen, planar VGA)
; The same desktop runs in either; mode12h needs ~150 KB free.
video=mode13h
; Starting directory for the Disk Cabinet (file manager).
default_path=C:\
; Window open zoom animation.  Set to false for the snappiest opens on a
; very slow 386 (windows then appear instantly).
animations=true
; Idle seconds before the Light Show takes over as a screensaver (any key
; or mouse movement brings the desktop back).  Set to 0 to disable.
screensaver=90
; Short PC-speaker chime when the desktop appears.  Set to false for silence.
sound=true
; Parallel-port audio for the Gramophone's WAV playback.  Declared, not
; probed (poking bytes at a printer prints garbage), like BLASTER was:
;   lptdac=covox    a Covox Speech Thing or clone (resistor-ladder DAC)
;   lptdac=dss      the Disney Sound Source (16-byte FIFO, ~7 kHz)
;   lptdac=off      parallel port is a printer, thanks     - the default
; lptport picks the LPT (1..3); its address comes from the BIOS.
;lptdac=off
;lptport=1
; The Start button's caption - localise it to taste ("Start", "Demarrer",
; "Avvio", "Iniciar"...).  The button sizes itself to fit.
;startlabel=Inicio

[mouse]
; Set to false to run keyboard-only (ESC exits from the bare desktop).
enabled=true

[clock]
; Show the HH:MM clock at the right of the taskbar.
enabled=true

; ----------------------------------------------------------------------
;  Desktop icons (up to 8).  Defining icon1 here REPLACES the built-in
;  icon set.  "command" is either an internal verb or a DOS program:
;     internal verbs : fileman | sysinfo | inspect | bench | about |
;                      exit | drawer | tools | arcade  (shell)
;                      scrap | calc | clock | paint | charmap |
;                      puzzle | ttt  (applets, inside the groups)
;     external       : COMMAND.COM | EDIT.COM | any .EXE/.COM/.BAT
;  ("drawer" opens the Program Drawer - a windowed grid of the [shortcut]
;   entries below; "tools" and "arcade" open the Toolbox and Arcade group
;   windows.)
;  Optional iconN_icon=PATH loads a 32x32 .ICN bitmap (see ASSETS/ICONS);
;  without it the matching built-in procedural icon is drawn.
;  Optional pattern= sets the desktop backdrop: solid | dots | weave |
;  gradient.  "gradient" is a subtle vertical sweep of the theme's desktop
;  colour (Mode 13h; Mode 12h falls back to solid).  "solid" is the lightest
;  to redraw if you want the snappiest dragging on a slow 386.
;  Optional wallpaper=PATH sets the desktop background.  A .ICN tiles a
;  32x32 motif; a .GIF is shown as a full 320x200 picture (Mode 13h) -
;  its palette loads into the free DAC window so the 16-colour UI is
;  untouched.  Either way it is composed once into the cached background,
;  so it costs nothing while you work.  Ships in ASSETS\ICONS: the tiles
;  CLOUDS/STARS/DIAMOND/CIRCUIT and the pictures CASTLE.GIF (the
;  default), SUNSET, BLISS, COSMOS, DUNES, NIGHT, REEF and PEAKS
;  (all cycled from Settings > Paper, or browsed full-screen with the
;  Picture Show in the Toolbox).
; ----------------------------------------------------------------------
;  iconN_icon= now accepts real Windows .ICO files as well as .ICN.  An
;  .ICO's colours are mapped to the nearest theme slot at load, so genuine
;  Win95 icon art renders here and recolours with the active theme.  A set
;  ships in ASSETS\ICONS (COMPUTR, FOLDER, GAMES, MEDIA, TOOLS, INFO,
;  DRIVE, PROGRAMS).
; ----------------------------------------------------------------------
[desktop]
pattern=gradient
wallpaper=ASSETS\ICONS\CASTLE.GIF
; Four desktop icons, laid out top-to-bottom then left-to-right in columns.
; No iconN_icon override, so each draws its crisp built-in pixel-art icon.
icon1_name=My Computer
icon1_command=fileman
icon2_name=Arcade
icon2_command=arcade
icon3_name=Toolbox
icon3_command=tools
icon4_name=Gramophone
icon4_command=gram

; ----------------------------------------------------------------------
;  Optional per-element palette overrides, applied on top of the theme.
;  Each line is  <slot>=R,G,B  (0..255).  Slots: black title desktop face
;  shadow hilight white ltblue red yellow dkyellow green dkgray blue cyan
;  cream.  Uncomment to tweak just the colours you want.
; ----------------------------------------------------------------------
;[colors]
;desktop=0,128,128
;title=0,0,160

; ----------------------------------------------------------------------
;  Optional file associations for the Disk Cabinet: EXT=applet.  A double
;  click on a matching file opens it there instead of being handed to
;  DOS.  Applets that can open a document:
;     scrap (text) | paint (.ICN) | gram (audio) | cinema (FLI/FLC) |
;     peek (hex view) | dos (run through DOS)
;  These OVERRIDE the built-in table (TXT/DOC/ME/LOG/INI/ASC -> scrap,
;  ICN -> paint, WAV/MID -> gram, FLI/FLC -> cinema, EXE/COM/BAT -> dos,
;  anything else -> peek).  Uncomment to tweak.
; ----------------------------------------------------------------------
;[assoc]
;TXT=scrap
;PCX=peek

; ----------------------------------------------------------------------
;  Optional Program Drawer scan: the EXE, COM and BAT files found in this
;  directory join the [shortcut] entries in the drawer's grid (sorted by
;  name, launched with the directory as their working dir).  The scan is
;  capped to the cells the screen can show.
; ----------------------------------------------------------------------
;[drawer]
;scan=C:\UTILS

; ----------------------------------------------------------------------
;  Dominus launcher menu, and the Program Drawer.  Each [shortcut] block
;  adds one entry; the first [shortcut] REPLACES the built-in menu.  These
;  same entries fill the Program Drawer (the "drawer" verb) as a grid of
;  labelled icons.  "path" (optional) is the working directory to switch to
;  before running an external command; "icon" (optional) is a 32x32 .ICN
;  bitmap shown in the drawer, else the procedural icon for the command.
;  "freemem=true" (optional) UNLOADS Castalia while the program runs, so a
;  memory-hungry game gets all of conventional memory; the desktop returns
;  when it exits.  This needs Castalia started via CASTSHEL.BAT (just type
;  CASTSHEL instead of CASTALIA); without the wrapper it falls back to a
;  normal resident launch.  Only useful for external programs.
; ----------------------------------------------------------------------
; The top-level launcher: the essentials plus three group icons.  It fills
; both the Dominus menu and the Program Drawer.  The Toolbox and Arcade
; entries open their OWN windowed icon grids (all the desk utilities, all
; the games) - so this
; list stays short and tidy while the whole toolset keeps growing behind
; the group icons.

; --- shell & system --------------------------------------------------
[shortcut]
name=My Computer
command=fileman

[shortcut]
name=Command Room
path=C:\
command=COMMAND.COM

[shortcut]
name=Find File
command=find

[shortcut]
name=Run...
command=run

[shortcut]
name=System Inspector
command=inspect

[shortcut]
name=Benchmark
command=bench

; --- groups & media --------------------------------------------------
[shortcut]
name=Toolbox
command=tools

[shortcut]
name=Arcade
command=arcade

; --- meta ------------------------------------------------------------
[shortcut]
name=About Castalia
command=about

[shortcut]
name=Exit to DOS
command=exit

; Example of a free-memory game entry (uncomment and edit for your game).
; With CASTSHEL.BAT, Castalia unloads so the game gets all of memory.
;[shortcut]
;name=Big Game
;path=C:\GAMES\BIGGAME
;command=GAME.EXE
;icon=ASSETS\ICONS\GAME.ICN
;freemem=true
